name: ci
on:
  pull_request:
  push: { branches: [main] }
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          {
            POSTGRES_USER: cockpit,
            POSTGRES_PASSWORD: cockpit,
            POSTGRES_DB: cockpit_test,
          }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://cockpit:cockpit@localhost:5432/cockpit_test
      JWT_ACCESS_SECRET: ci-only-secret-with-at-least-32-chats!!
      WEB_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      - run: npm exec -w apps/api -- prisma migrate deploy
      - run: npm run test:e2e -w apps/api
